<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Focus Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 AI Focus Agent</h1>
      <p class="tagline">Stay focused, achieve more</p>
    </header>

    <section class="stats">
      <h2>Session Stats</h2>
      <div class="stat-grid">
        <div class="stat-item">
          <span class="stat-label">Session Time</span>
          <span class="stat-value" id="sessionTime">0m</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Distractions</span>
          <span class="stat-value" id="distractionCount">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Current Site</span>
          <span class="stat-value" id="currentCategory">Unknown</span>
        </div>
      </div>
    </section>

    <section class="quick-settings">
      <h2>Quick Focus</h2>
      <div class="focus-input">
        <input
          type="text"
          id="focusDomain"
          placeholder="Add focus domain (e.g., github.com)"
        >
        <button id="addFocus">Add</button>
      </div>
      <div id="focusList" class="focus-list"></div>
    </section>

    <section class="actions">
      <button id="resetStats" class="btn-secondary">Reset Session</button>
      <button id="openOptions" class="btn-primary">Settings</button>
    </section>

    <section class="current-status">
      <div id="statusMessage" class="status-message">
        Ready to help you focus! 🚀
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
